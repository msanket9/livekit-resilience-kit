services:
  webhook-receiver:
    build: ./webhook_receiver
    container_name: webhook-receiver
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      WEBHOOK_LOG_PATH: /data/webhooks.jsonl
    volumes:
      - ./data:/data
    networks:
      - resilience-net

  livekit-server:
    image: livekit/livekit-server:latest
    container_name: livekit-server
    command: --config /etc/livekit.yaml --dev
    depends_on:
      - webhook-receiver
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50019:50000-50019/udp"
    networks:
      - resilience-net

  client-a:
    build: ./client
    container_name: client-a
    depends_on:
      livekit-server:
        condition: service_started
      agent:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      ROOM_NAME: resilience-test
      PARTICIPANT_IDENTITY: client-a
      PUBLISH_AUDIO: "true"
      EVENT_LOG_PATH: /data/client-a-events.jsonl
      RED_ENABLED: ${RED_ENABLED:-default}
    volumes:
      - ./data:/data
    networks:
      - resilience-net

  client-b:
    build: ./client
    container_name: client-b
    depends_on:
      livekit-server:
        condition: service_started
      agent:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      ROOM_NAME: resilience-test
      PARTICIPANT_IDENTITY: client-b
      PUBLISH_AUDIO: "false"
      EVENT_LOG_PATH: /data/client-b-events.jsonl
    volumes:
      - ./data:/data
    networks:
      - resilience-net

  agent:
    build: ./agent
    container_name: agent
    depends_on:
      - livekit-server
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      EVENT_LOG_PATH: /data/agent-events.jsonl
    volumes:
      - ./data:/data
    networks:
      - resilience-net
    healthcheck:
      # the worker's HTTP server comes up slightly before it finishes
      # registering with the LiveKit server for automatic dispatch; clients
      # wait on this so they don't create the room before the agent can be
      # dispatched into it (dispatch is a room-creation-time event -- a
      # worker that registers after the room already exists never gets it)
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

networks:
  resilience-net:
    driver: bridge
