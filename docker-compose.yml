services:
  webhook-receiver:
    build: ./webhook_receiver
    container_name: webhook-receiver
    environment:
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      WEBHOOK_LOG_PATH: /data/webhooks.jsonl
    volumes:
      - ./data:/data
    networks:
      - resilience-net
    healthcheck:
      # server.py has always exposed /healthz; nothing used it. Wiring it up so
      # livekit-server waits for the receiver to actually be listening rather
      # than merely for its container to have started -- a webhook fired at a
      # process that has not bound its port yet is simply lost, and the server
      # webhooks are the report's independent cross-check on client-reported
      # reconnects.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: on-failure:3

  livekit-server:
    # Pinned exactly, for the same reason the three requirements.txt files
    # pin the Python SDKs: this kit's output is measurements, and livekit-server
    # is the actual SFU whose congestion control, jitter buffer, and RED
    # handling directly produce the connection-quality and concealed-audio
    # numbers being measured -- an unpinned server image is a more direct
    # violation of "don't silently compare numbers from a different WebRTC
    # stack" than the already-pinned Python clients. v1.13.6 is what `:latest`
    # resolved to when this was pinned (same image digest, confirmed via
    # `docker inspect`).
    image: livekit/livekit-server:v1.13.6
    container_name: livekit-server
    command: --config /etc/livekit.yaml --dev
    depends_on:
      webhook-receiver:
        condition: service_healthy
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50019:50000-50019/udp"
    networks:
      - resilience-net
    restart: on-failure:3

  client-a:
    build: ./client
    container_name: client-a
    depends_on:
      livekit-server:
        condition: service_started
      agent:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      ROOM_NAME: resilience-test
      PARTICIPANT_IDENTITY: client-a
      PUBLISH_AUDIO: "true"
      EVENT_LOG_PATH: /data/client-a-events.jsonl
      RED_ENABLED: ${RED_ENABLED:-default}
    volumes:
      - ./data:/data
    networks:
      - resilience-net
    restart: on-failure:3

  client-b:
    build: ./client
    container_name: client-b
    depends_on:
      livekit-server:
        condition: service_started
      agent:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      ROOM_NAME: resilience-test
      PARTICIPANT_IDENTITY: client-b
      PUBLISH_AUDIO: "false"
      EVENT_LOG_PATH: /data/client-b-events.jsonl
    volumes:
      - ./data:/data
    networks:
      - resilience-net
    restart: on-failure:3

  agent:
    build: ./agent
    container_name: agent
    depends_on:
      - livekit-server
    environment:
      LIVEKIT_URL: ws://livekit-server:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
      EVENT_LOG_PATH: /data/agent-events.jsonl
    volumes:
      - ./data:/data
    networks:
      - resilience-net
    healthcheck:
      # Clients wait on this so they don't create the room before the agent
      # can be dispatched into it (dispatch is a room-creation-time event --
      # a worker that registers after the room already exists never gets it).
      # Checking the HTTP endpoint ALONE is not enough: it comes up as soon as
      # the worker process starts, before it has actually registered with
      # LiveKit -- verified directly, pointed at an unreachable LIVEKIT_URL,
      # it returned 200 OK for the whole connection-retry backoff window. The
      # marker file is written by agent.py only on the SDK's own
      # "worker_registered" event, so both together are the real signal.
      test: ["CMD", "python3", "-c", "import os, urllib.request; assert os.path.exists('/tmp/agent-registered'); urllib.request.urlopen('http://localhost:8081/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: on-failure:3

networks:
  resilience-net:
    driver: bridge
